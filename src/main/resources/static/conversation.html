<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>Conversation - Team Rocket</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>

<div class="app-shell">


    <!-- Header -->

    <header class="app-header">

        <div class="brand-section">

            <div class="brand-icon">
                <span>▢</span>
            </div>

            <div class="brand-name">
                Team Rocket Messaging App
            </div>

        </div>


        <div class="header-right">

            <span class="logged-in-text">
                Logged in as <strong id="currentUsername">User</strong>
            </span>

            <button
                    class="header-logout"
                    id="logoutButton">

                Logout

            </button>

        </div>

    </header>


    <!-- Main -->

    <main class="main-content conversation-page">

        <div class="conversation-container">


            <!-- Conversation Header -->

            <div class="conversation-heading">


                <button
                        class="back-button"
                        id="backButton">

                    Back

                </button>


                <div class="conversation-user">

                    <h1 id="conversationUsername">
                        User
                    </h1>

                    <p>
                        Direct conversation
                    </p>

                </div>


            </div>


            <!-- Messages -->

            <div
                    class="messages-card"
                    id="messagesContainer">

                <!-- Date -->

                <div class="conversation-date">
                    Today
                </div>


                <!-- Messages will be inserted here -->

            </div>


            <!-- Message Input -->

            <form
                    id="messageForm"
                    class="message-input-container">


                <input
                        type="text"
                        id="messageInput"
                        placeholder="Type a message..."
                        autocomplete="off"
                        maxlength="1000"
                        required
                >


                <button
                        type="submit"
                        class="btn btn-primary send-button"
                        id="sendButton">

                    Send

                </button>


            </form>


            <div class="conversation-footer">

                Conversation with
                <strong id="conversationFooterUsername">
                    User
                </strong>

            </div>

        </div>

    </main>


    <!-- Footer -->

    <footer class="app-footer">

        <span>
            Conversation
        </span>

        <span>
            Team Rocket · Direct messaging
        </span>

    </footer>


</div>


<script src="js/conversation.js"></script>

</body>

</html>
